<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG Esperança</title>
</head>

<body>

    <header>
        <h1>ONG Esperança</h1>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html">Cadastre-se</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Cadastro de Voluntário</h2>

            <p>
                Preencha seus dados abaixo para demonstrar interesse
                em participar das ações da ONG Esperança.
            </p>

            <form>

                <fieldset>
                    <legend>Informações Pessoais</legend>

                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>

                    <br><br>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                    <br><br>

                    <label for="cpf">CPF:</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        title="Digite o CPF no formato 000.000.000-00"
                        required
                    >

                    <br><br>

                    <label for="nascimento">Data de nascimento:</label>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required
                    >

                    <br><br>

                    <label for="telefone">Telefone:</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                        title="Digite o telefone no formato (00) 00000-0000"
                        required
                    >

                </fieldset>

                <br>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="cep">CEP:</label>
                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        pattern="[0-9]{5}-[0-9]{3}"
                        title="Digite o CEP no formato 00000-000"
                        required
                    >

                    <br><br>

                    <label for="endereco">Endereço:</label>
                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        required
                    >

                    <br><br>

                    <label for="numero">Número:</label>
                    <input
                        type="number"
                        id="numero"
                        name="numero"
                        min="1"
                        required
                    >

                    <br><br>

                    <label for="cidade">Cidade:</label>
                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        required
                    >

                    <br><br>

                    <label for="estado">Estado:</label>

                    <select id="estado" name="estado" required>
                        <option value="">Selecione</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PR">Paraná</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="BA">Bahia</option>
                        <option value="PE">Pernambuco</option>
                    </select>

                </fieldset>

                <br>

                <fieldset>
                    <legend>Interesse</legend>

                    <label for="area">Área de interesse:</label>

                    <select id="area" name="area" required>
                        <option value="">Selecione uma opção</option>
                        <option value="educacao">Educação</option>
                        <option value="doacao">Campanhas de doação</option>
                        <option value="eventos">Eventos e ações sociais</option>
                        <option value="comunicacao">Comunicação</option>
                    </select>

                </fieldset>

                <br>

                <button type="submit">Enviar cadastro</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 ONG Esperança. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
